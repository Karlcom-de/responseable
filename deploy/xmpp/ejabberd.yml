# XMPP pilot template. Mount certificates and the JWT JWK from Secrets.
hosts: [chat.example.test]
auth_method: [jwt, internal]
jwt_auth_only_rule: jwt_only
oauth_access: provisioner
jwt_key: /run/xmpp/jwt.jwk
sql_type: pgsql
sql_server: xmpp-archive
sql_database: xmpp
sql_username: xmpp
sql_password: ARCHIVE_PASSWORD
certfiles: [/run/xmpp/tls.pem]
listen:
  - port: 5443
    module: ejabberd_http
    tls: true
    request_handlers:
      /xmpp-websocket: ejabberd_http_ws
  - port: 5444
    module: ejabberd_http
    tls: true
    request_handlers:
      /api: mod_http_api
acl:
  provisioner:
    user: provisioner@chat.example.test
access_rules:
  jwt_only:
    deny: provisioner
    allow: all
  provisioner:
    allow: provisioner
    deny: all
  s2s:
    deny: all
s2s_access: s2s
api_permissions:
  "Room provisioning":
    from: [mod_http_api]
    who:
      oauth:
        scope: ejabberd:admin
        access:
          allow: provisioner
    what: [set_room_affiliation]
modules:
  mod_http_api: {}
  mod_disco: {}
  mod_muc_admin: {}
  mod_mam:
    db_type: sql
    default: never
  mod_muc:
    host: muc.chat.example.test
    access_create: provisioner
    access_admin: provisioner
    default_room_options:
      persistent: true
      public: false
      public_list: false
      members_only: true
      allow_user_invites: false
      allowpm: none
      allow_private_messages_from_visitors: nobody
      mam: true
