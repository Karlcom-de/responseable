services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: responseable_demo
      POSTGRES_USER: responseable
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U responseable -d responseable_demo"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-demo:/var/lib/postgresql/data
volumes:
  postgres-demo:
