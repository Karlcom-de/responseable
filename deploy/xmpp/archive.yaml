apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: xmpp-archive}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: xmpp-archive}
spec:
  selector: {app: xmpp-archive}
  ports:
    - {port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: xmpp-archive}
spec:
  podSelector:
    matchLabels: {app: xmpp-archive}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: xmpp-pilot}
      ports:
        - {port: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: xmpp-archive}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: xmpp-archive}
  template:
    metadata:
      labels: {app: xmpp-archive}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: {name: xmpp-archive-db}
          env:
            - {name: PGDATA, value: /data/pgdata}
          readinessProbe:
            exec: {command: [pg_isready, -h, "127.0.0.1", -d, xmpp, -U, xmpp]}
          securityContext:
            appArmorProfile: {type: Unconfined}
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: xmpp-archive}
