{{- if .Values.media.enabled }}
{{- $media := .Values.media }}
{{- $name := printf "%s-media" .Release.Name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $media.replicas }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 900
      nodeSelector: {{ toYaml $media.nodeSelector | nindent 8 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit
          image: {{ $media.image | quote }}
          args: ["--config", "/etc/livekit/config.yaml"]
          ports:
            - { name: signal, containerPort: 7880 }
            - { name: rtc-tcp, containerPort: 7881 }
            - { name: rtc-udp, containerPort: 7882, protocol: UDP }
          {{- if $media.turnTlsSecret }}
            - { name: turn-tls, containerPort: 5349 }
            - { name: turn-udp, containerPort: 3478, protocol: UDP }
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources: {{ toYaml $media.resources | nindent 12 }}
          startupProbe:
            tcpSocket: { port: signal }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: signal }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: signal }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/livekit, readOnly: true }
          {{- if $media.turnTlsSecret }}
            - { name: turn-tls, mountPath: /etc/turn, readOnly: true }
          {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ $media.configSecret }}
        {{- if $media.turnTlsSecret }}
        - name: turn-tls
          secret:
            secretName: {{ $media.turnTlsSecret }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - { name: signal, port: 7880, targetPort: signal }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- if $media.ingress.enabled }}
{{- $host := required "Set media.ingress.host" $media.ingress.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
spec:
  ingressClassName: {{ $media.ingress.className }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ required "Set media.ingress.tlsSecret" $media.ingress.tlsSecret }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: signal
{{- end }}
{{- end }}
