apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xmpp-pilot-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmpp-pilot
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: xmpp-pilot}
  template:
    metadata:
      labels: {app: xmpp-pilot}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 9000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ejabberd
          image: ghcr.io/processone/ejabberd:25.10
          ports:
            - {name: websocket, containerPort: 5443}
            - {name: admin, containerPort: 5444}
          readinessProbe:
            tcpSocket: {port: websocket}
          securityContext:
            runAsNonRoot: true
            runAsUser: 9000
            runAsGroup: 9000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - {name: data, mountPath: /opt/ejabberd/database}
            - {name: config, mountPath: /opt/ejabberd/conf/ejabberd.yml, subPath: ejabberd.yml, readOnly: true}
            - {name: identity, mountPath: /run/xmpp, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: xmpp-pilot-data}
        - name: config
          configMap: {name: xmpp-pilot-config}
        - name: identity
          secret: {secretName: xmpp-pilot-identity}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xmpp-pilot-private
spec:
  podSelector:
    matchLabels: {app: xmpp-pilot}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: responseable-xmpp-pilot}
      ports:
        - {port: 5443, protocol: TCP}
        - {port: 5444, protocol: TCP}
