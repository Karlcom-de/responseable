apiVersion: v1
kind: Service
metadata: {name: exercise-reconcile}
spec:
  selector: {app-role: xmpp-bootstrap}
  ports:
    - {port: 3000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: exercise-reconcile}
spec:
  podSelector:
    matchLabels: {app-role: xmpp-bootstrap}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: exercise-reconcile}
      ports:
        - {port: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: exercise-reconcile}
spec:
  replicas: 1
  selector:
    matchLabels: {app: exercise-reconcile}
  template:
    metadata:
      labels: {app: exercise-reconcile}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: node:24-bookworm-slim
          env:
            - name: XMPP_RECONCILE_TOKEN
              valueFrom:
                secretKeyRef: {name: xmpp-exercise-app, key: XMPP_RECONCILE_TOKEN}
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          command: [node, --input-type=module, -e]
          args:
            - |
              for (;;) {
                try {
                  const response = await fetch("http://exercise-reconcile:3000/internal/xmpp", {
                    headers: {authorization: "Bearer " + process.env.XMPP_RECONCILE_TOKEN},
                    signal: AbortSignal.timeout(6000)
                  });
                  if (!response.ok) console.error("Reconciler HTTP " + response.status);
                  else await response.json();
                } catch { console.error("Reconciler cannot reach the application"); }
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
